name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lokka_test
          POSTGRES_USER: lokka
          POSTGRES_PASSWORD: development_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lokka -d lokka_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lokka:development_only@localhost:5432/lokka_test
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
